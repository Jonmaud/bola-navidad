<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Feliz Navidad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg1: #0b1d3a; --bg2: #14305c; --card: rgba(255,255,255,.09); --card-border: rgba(255,255,255,.18);
    --text: #f4f7ff; --muted: #b8c7e6; --accent: #ffd36b; --ok: #5fd38a; --warn: #ffb347; --bad: #ff6b6b;
    --track: rgba(255,255,255,.18);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg1: #e8f1ff; --bg2: #c9defa; --card: rgba(255,255,255,.75); --card-border: rgba(20,48,92,.15);
      --text: #11284d; --muted: #4a5f84; --accent: #b3261e; --ok: #1e8e4e; --warn: #b36b00; --bad: #c0392b;
      --track: rgba(20,48,92,.15);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2)); display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden;
  }
  .snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .flake { position: absolute; top: -10px; color: #fff; opacity: .8; animation: fall linear infinite; }
  @media (prefers-color-scheme: light) { .flake { color: #8fb3e8; } }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .snow { display: none; } }
  main {
    position: relative; width: 100%; max-width: 420px; text-align: center; padding: 28px 22px 24px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 22px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .tree { font-size: 56px; line-height: 1; margin-bottom: 6px; }
  h1 { font-size: 1.7rem; margin: 6px 0 4px; color: var(--accent); }
  .greeting { margin: 0 0 22px; color: var(--muted); line-height: 1.45; }
  .label { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .song { font-size: 1.35rem; font-weight: 650; margin: 0 0 22px; word-break: break-word; }
  .battery { margin: 0 0 4px; }
  .bar { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; margin: 6px 0 6px; }
  .fill { height: 100%; width: 0; border-radius: 6px; background: var(--ok); transition: width .6s ease; }
  .pct { font-weight: 650; }
  .alert { margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: .95rem; line-height: 1.4;
           border: 1px solid var(--bad); color: var(--bad); }
  [hidden] { display: none !important; }
  footer { margin-top: 20px; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<main>
  <div class="tree" aria-hidden="true">🎄</div>
  <h1 id="title"></h1>
  <p class="greeting" id="greeting"></p>

  <section id="songBox" hidden>
    <div class="label">Canción</div>
    <p class="song" id="song"></p>
  </section>

  <section id="batBox" hidden>
    <div class="label">Batería de la bola</div>
    <div class="battery"><span class="pct" id="pct"></span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div class="fill" id="fill"></div></div>
  </section>

  <div class="alert" id="alert" role="alert" hidden></div>
  <footer id="footer"></footer>
</main>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     TEXTOS: edítalos a tu gusto (se muestran tal cual, nunca como HTML)
     ------------------------------------------------------------------ */
  var CFG = {
    title:    "¡Feliz Navidad!",
    greeting: "",
    footer:   "",
    lowText:  "Batería baja: conecta la bola por USB-C para cargarla.",
    lowLevel: 15        /* % por debajo del cual se avisa aunque el firmware no mande l=1 */
  };

  var params = new URLSearchParams(window.location.search);

  function setText(id, text) { document.getElementById(id).textContent = text; }
  function show(id) { document.getElementById(id).hidden = false; }

  setText("title", CFG.title);
  setText("greeting", CFG.greeting);
  setText("footer", CFG.footer);

  /* t = título de la canción (el firmware lo codifica en porcentaje; URLSearchParams ya lo descodifica) */
  var song = (params.get("t") || "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, 60);
  if (song) { setText("song", song); show("songBox"); }

  /* b = batería 0-100; l=1 = aviso de batería baja enviado por el firmware */
  var raw = params.get("b");
  var pct = null;
  if (raw !== null && /^\d{1,3}$/.test(raw)) { pct = Math.min(100, parseInt(raw, 10)); }
  var low = params.get("l") === "1" || (pct !== null && pct <= CFG.lowLevel);

  if (pct !== null) {
    setText("pct", pct + " %");
    var fill = document.getElementById("fill");
    fill.style.background = pct <= CFG.lowLevel ? "var(--bad)" : (pct <= 35 ? "var(--warn)" : "var(--ok)");
    document.getElementById("bar").setAttribute("aria-valuenow", String(pct));
    show("batBox");
    requestAnimationFrame(function () { fill.style.width = pct + "%"; });
  }
  if (low) { setText("alert", CFG.lowText); show("alert"); }

  /* nieve decorativa */
  var snow = document.getElementById("snow");
  for (var i = 0; i < 28; i++) {
    var f = document.createElement("span");
    f.className = "flake";
    f.textContent = "❄";
    f.style.left = (Math.random() * 100) + "vw";
    f.style.fontSize = (10 + Math.random() * 14) + "px";
    f.style.animationDuration = (7 + Math.random() * 9) + "s";
    f.style.animationDelay = (-Math.random() * 12) + "s";
    snow.appendChild(f);
  }
})();
</script>
</body>
</html>
