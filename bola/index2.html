<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1730">
<title>Feliz Navidad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --sky1: #08122a; --sky2: #14305c; --text: #f6f8ff; --muted: #c3d0ee; --gold: #ffd36b;
    --ok: #5fd38a; --warn: #ffb347; --bad: #ff6b6b; --track: rgba(255,255,255,.16);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; color: var(--text); overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 70%, #1d4278 100%) fixed;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top, 0px) 16px calc(150px + env(safe-area-inset-bottom, 0px));
  }
  #snow, .stars, .hills { position: fixed; left: 0; pointer-events: none; }
  .stars { inset: 0; z-index: 0; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff;
             animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  #snow { inset: 0; width: 100%; height: 100%; z-index: 3; }
  .hills { bottom: 0; width: 100%; height: min(24vh, 200px); z-index: 1; }

  /* ---- adorno colgando ---- */
  .orn { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;
         transform-origin: 50% 0; animation: sway 7s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
  .string { width: 2px; height: clamp(28px, 8vh, 70px); background: linear-gradient(#ffffff55, #ffd36bcc); }
  .cap { width: 34px; height: 16px; border-radius: 4px 4px 7px 7px; margin-top: -1px;
         background: linear-gradient(90deg, #b88a1e, #ffe08a 45%, #c79a2a); box-shadow: 0 2px 6px #0006; }
  .ball {
    position: relative; width: min(86vw, 360px); aspect-ratio: 1; border-radius: 50%; margin-top: -2px;
    background: radial-gradient(circle at 30% 24%, rgba(255,255,255,.34), rgba(255,255,255,.06) 38%, rgba(10,23,48,.55) 100%),
                radial-gradient(circle at 50% 50%, #1b3d73, #0d2144);
    box-shadow: 0 18px 44px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
  }
  .ring { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .ring .track { stroke: var(--track); }
  .ring .arc { stroke: var(--ok); opacity: 0; stroke-dasharray: 0 100; transition: stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1); }
  .inner { width: 74%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .55rem; }
  h1 { margin: 0; font: 700 clamp(1.6rem, 8.2vw, 2.15rem)/1.1 "Palatino Linotype", Palatino, Georgia, serif;
       color: var(--gold); text-shadow: 0 0 18px rgba(255,211,107,.45); }
  .greeting { margin: 0; font-size: clamp(.85rem, 3.6vw, .98rem); line-height: 1.4; color: var(--muted); }
  .song { display: flex; align-items: center; gap: .55rem; font-weight: 650; font-size: clamp(.95rem, 4.4vw, 1.12rem);
          line-height: 1.2; word-break: break-word; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; flex: none; }
  .eq b { width: 3px; height: 100%; background: var(--gold); border-radius: 1px; transform-origin: bottom;
          animation: eq 1s ease-in-out infinite; }
  .eq b:nth-child(2) { animation-duration: .75s; animation-delay: -.3s; }
  .eq b:nth-child(3) { animation-duration: 1.2s; animation-delay: -.6s; }
  .eq b:nth-child(4) { animation-duration: .9s; animation-delay: -.15s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .bat { font-size: .82rem; letter-spacing: .06em; color: var(--muted); }
  .bat strong { font-size: 1rem; letter-spacing: 0; color: var(--text); }
  .alert { margin-top: 18px; max-width: 340px; padding: 10px 14px; border-radius: 14px; text-align: center; font-size: .92rem;
           line-height: 1.4; color: #ffd5d5; background: rgba(255,107,107,.14); border: 1px solid var(--bad); }
  footer { margin-top: 14px; font-size: .8rem; color: var(--muted); text-align: center; position: relative; z-index: 2; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .orn, .stars i, .eq b, .lights circle { animation: none !important; }
    #snow { display: none; }
  }
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<svg class="hills" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path d="M0 90 Q90 55 190 82 T400 70 V140 H0Z" fill="#9db8e6"/>
  <path d="M0 112 Q120 80 230 106 T400 98 V140 H0Z" fill="#e6eeff"/>
  <g id="trees"></g>
</svg>
<canvas id="snow" aria-hidden="true"></canvas>

<main class="orn">
  <div class="string"></div><div class="cap"></div>
  <div class="ball">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="48"/>
      <circle class="arc" id="arc" cx="50" cy="50" r="48" pathLength="100"/>
    </svg>
    <div class="inner">
      <h1 id="title"></h1>
      <p class="greeting" id="greeting"></p>
      <div class="song" id="songBox" hidden>
        <span class="eq" aria-hidden="true"><b></b><b></b><b></b><b></b></span>
        <span id="song"></span>
      </div>
      <div class="bat" id="batBox" hidden>Batería <strong id="pct"></strong></div>
    </div>
  </div>
</main>
<div class="alert" id="alert" role="alert" hidden></div>
<footer id="footer"></footer>

<script>
(function () {
  "use strict";

  /* TEXTOS: edítalos a tu gusto (se muestran tal cual, nunca como HTML) */
  var CFG = {
    title:    "Merry Christmas!",
    greeting: "",
    footer:   "",
    lowText:  "Batería baja: conecta la bola por USB-C para cargarla.",
    lowLevel: 15
  };

  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(window.location.search);
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  $("title").textContent = CFG.title;
  $("greeting").textContent = CFG.greeting;
  $("greeting").hidden = !CFG.greeting;
  $("footer").textContent = CFG.footer;

  /* t = título de la canción; b = batería 0-100; l=1 = aviso de batería baja */
  var song = (params.get("t") || "").replace(/[\u0000-\u001f\u007f]/g, " ")
    .replace(/\.(wav|bin)$/i, "").replace(/_/g, " ").replace(/\s+/g, " ").trim().slice(0, 60);
  if (song) { $("song").textContent = song; $("songBox").hidden = false; }

  var raw = params.get("b"), pct = null;
  if (raw !== null && /^\d{1,3}$/.test(raw)) { pct = Math.min(100, parseInt(raw, 10)); }
  var low = params.get("l") === "1" || (pct !== null && pct <= CFG.lowLevel);

  if (pct !== null) {
    $("pct").textContent = pct + " %";
    $("batBox").hidden = false;
    var arc = $("arc");
    arc.style.opacity = 1;
    arc.style.stroke = pct <= CFG.lowLevel ? "var(--bad)" : (pct <= 35 ? "var(--warn)" : "var(--ok)");
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      arc.style.strokeDasharray = pct + " 100";
    }); });
  }
  if (low) { $("alert").textContent = CFG.lowText; $("alert").hidden = false; }

  /* estrellas */
  var stars = $("stars");
  for (var s = 0; s < 36; s++) {
    var st = document.createElement("i");
    st.style.left = (Math.random() * 100) + "%";
    st.style.top = (Math.random() * 55) + "%";
    st.style.animationDelay = (-Math.random() * 3) + "s";
    stars.appendChild(st);
  }

  /* abetos con luces que parpadean */
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    parent.appendChild(e); return e;
  }
  var trees = $("trees"), COLORS = ["#ffd36b", "#ff6b6b", "#7fc8ff", "#fff"];
  function tree(cx, base, h, w) {
    el("rect", { x: cx - w * .05, y: base - h * .1, width: w * .1, height: h * .12, fill: "#4a2f1d" }, trees);
    var g = el("g", { "class": "lights" }, trees);
    for (var t = 0; t < 3; t++) {
      var top = base - h * (1 - t * .26), bot = base - h * (.52 - t * .26) - h * .08, half = w * (.28 + t * .11);
      el("polygon", { points: cx + "," + top + " " + (cx - half) + "," + bot + " " + (cx + half) + "," + bot, fill: "#0f3b2e" }, trees);
      for (var i = 0; i < 4; i++) {
        var a = Math.random(), b = Math.random() * (1 - a);
        var px = cx + ((1 - a - b) * 0 + a * -half + b * half), py = top + (a + b) * (bot - top);
        var c = el("circle", { cx: px.toFixed(1), cy: py.toFixed(1), r: 2.1, fill: COLORS[(t + i) % 4] }, g);
        c.style.animation = "tw " + (1.2 + Math.random() * 1.6).toFixed(1) + "s ease-in-out " + (-Math.random() * 2).toFixed(1) + "s infinite";
      }
    }
  }
  tree(92, 112, 78, 50); tree(300, 104, 60, 40); tree(328, 108, 44, 30);

  /* nieve (canvas, con viento suave) */
  var cv = $("snow"), cx2 = cv.getContext("2d"), W, H, flakes = [], t0 = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.max(60, Math.min(150, Math.round(W * H / 9000)));
    flakes = [];
    for (var i = 0; i < n; i++) {
      var r = .8 + Math.random() * 2.6;
      flakes.push({ x: Math.random() * W, y: Math.random() * H, r: r, v: .25 + r * .32, p: Math.random() * 6.28, w: .3 + Math.random() * .7 });
    }
  }
  function frame() {
    t0 += .012; cx2.clearRect(0, 0, W, H);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.v; f.x += Math.sin(t0 * f.w + f.p) * .45 + .12;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      if (f.x > W + 4) { f.x = -4; }
      cx2.globalAlpha = .3 + f.r / 4.2;
      cx2.beginPath(); cx2.arc(f.x, f.y, f.r, 0, 6.2832); cx2.fillStyle = "#fff"; cx2.fill();
    }
    if (!still) { requestAnimationFrame(frame); }
  }
  window.addEventListener("resize", resize);
  resize();
  if (!still) { frame(); }
})();
</script>
</body>
</html>
